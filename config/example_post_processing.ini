# Post Processing configuration file for the DRI-OWRD Statewide ET Project

[INPUTS]

# root directory where this code repository is located on the local file system
root_directory = C:\Users\bminor\Documents\GitHub\dri-owrd-et
#root_directory = /Users/blakeminor/Documents/GitHub/dri-owrd-et

# field_boundary shapefile name (must be located within the "shapefiles" subfolder for pre- & post-processing)
field_boundary_shapefile_name = Oregon_Hyd_Area_Ag_Boundaries_20241016.shp

# unique ID column/attribute for the field boundary dataset
unique_field_id = OPENET_ID

# watershed HUC-level to aggregate field summaries by (HUC8 or HUC12 only)
huc_level = HUC12

# start and end years to process data for
# 1985-2024 available (as of March 2026)
start_year = 1985
end_year = 1991

# flag to process data for an individual field/HUC (True) or the entire field boundary/HUC datasets (False)
test_flag = True

# irrigation water source type for HUC aggregations of water use variables (all, groundwater, or surface_water)
irrigation_source_type = all